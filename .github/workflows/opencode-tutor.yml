name: BIOMED OpenCode Tutor - read only

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Pergunta pedagógica para testar o tutor"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".opencode-smoke-test"

permissions:
  contents: read
  actions: read

jobs:
  tutor:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Obter credencial OIDC efêmera do GitHub
        shell: bash
        run: |
          RESPONSE="$(curl -fsS             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=biomed-opencode")"
          TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.value')"
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "BIOMED_PROXY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Executar OpenCode Tutor gratuito
        uses: anomalyco/opencode/github@latest
        env:
          BIOMED_PROXY_TOKEN: ${{ env.BIOMED_PROXY_TOKEN }}
        with:
          model: biomed-free/biomed-tutor
          agent: tutor
          share: false
          prompt: |
            Você é o Tutor BIOMED.
            Leia TUTOR_RULES.md antes de responder.
            Você está em execução SOMENTE LEITURA.
            Não altere arquivos, branches, issues, pull requests ou configurações.
            Não execute tarefas administrativas.
            Responda apenas como tutor educacional.

            Solicitação:
            ${{ inputs.prompt || 'Teste de funcionamento: explique em três frases a diferença entre nocicepção e dor e finalize com uma pergunta ao aluno.' }}
