name: BIOMED OpenCode Tutor - read only

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Pergunta pedagógica para testar o tutor"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: read
  models: read

jobs:
  tutor:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[BIOMED TUTOR]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      models: read

    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Instalar OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Executar Tutor OpenCode com GitHub Models Free
        shell: bash
        env:
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          PROMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.issue.body }}
        run: |
          opencode run             --model github-models/openai/gpt-4.1-mini             --agent tutor             --format json             "$PROMPT" | tee opencode-output.ndjson

      - name: Confirmar que o tutor respondeu
        shell: bash
        run: |
          test -s opencode-output.ndjson
          grep -q '"type"' opencode-output.ndjson
          echo "OpenCode Tutor executado com sucesso usando GitHub Models em modo somente leitura."
