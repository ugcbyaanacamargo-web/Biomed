name: BIOMED OpenCode Tutor - read only

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Pergunta pedagógica para testar o tutor"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  tutor:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Executar OpenCode sem permissão de escrita
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/nemotron-3.5-lightning-free
          share: false
          prompt: |
            Você é o Tutor BIOMED.
            Leia TUTOR_RULES.md antes de responder.
            Você está em execução SOMENTE LEITURA.
            Não altere arquivos, branches, issues, pull requests ou configurações.
            Não execute tarefas administrativas.
            Responda apenas como tutor educacional.
            Pergunta recebida:
            ${{ inputs.prompt }}
