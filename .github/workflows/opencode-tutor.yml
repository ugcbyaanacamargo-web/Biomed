name: BIOMED OpenCode Tutor - Muse Spark 1.3 Contributor Free

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Pergunta pedagógica para testar o tutor"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  tutor:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[BIOMED TUTOR]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read

    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validar chave OpenCode Zen
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::Adicione o secret OPENCODE_API_KEY ao repositório."
            exit 1
          fi

      - name: Instalar OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Executar Tutor com Muse Spark 1.3 Contributor Free
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PROMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.issue.body }}
        run: |
          timeout 180s opencode run             --model opencode/muse-spark-1.3-contributor-free             --agent tutor             --format json             "$PROMPT" | tee opencode-output.ndjson

      - name: Validar resposta
        shell: bash
        run: |
          test -s opencode-output.ndjson
          grep -q '"type"' opencode-output.ndjson
          echo "OpenCode Tutor executado com Muse Spark 1.3 Contributor Free."
