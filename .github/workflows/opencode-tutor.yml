name: BIOMED OpenCode Tutor - read only

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Pergunta pedagógica para testar o tutor"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  tutor:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[BIOMED TUTOR]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read

    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Instalar e iniciar Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Baixar Qwen para o runner
        shell: bash
        run: |
          ollama pull qwen2.5:3b
          ollama list
          curl -fsS http://127.0.0.1:11434/api/generate             -H "Content-Type: application/json"             -d '{"model":"qwen2.5:3b","prompt":"Responda somente BIOMED_OK","stream":false,"options":{"num_predict":20}}'             | tee /tmp/ollama-smoke.json
          test -s /tmp/ollama-smoke.json
          grep -q 'BIOMED_OK' /tmp/ollama-smoke.json

      - name: Instalar OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Executar Tutor OpenCode local
        shell: bash
        env:
          PROMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.issue.body }}
        run: |
          timeout 150s opencode run             --model ollama/qwen2.5:3b             --agent tutor             --format json             "$PROMPT" | tee opencode-output.ndjson

      - name: Validar resposta
        shell: bash
        run: |
          test -s opencode-output.ndjson
          grep -q '"type"' opencode-output.ndjson
          echo "OpenCode Tutor executado com Qwen local. Nenhuma API externa foi usada."
