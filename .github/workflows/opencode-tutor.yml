name: BIOMED OpenCode Tutor - Muse Spark 1.3

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Pergunta pedagógica para testar o tutor"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  tutor:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[BIOMED TUTOR]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read

    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validar chave OpenCode Zen
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          test -n "$OPENCODE_API_KEY" || { echo "::error::Secret OPENCODE_API_KEY ausente"; exit 1; }

      - name: Instalar OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Executar Tutor OpenCode
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"*":"ask","external_directory":"deny"}'
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENCODE_DISABLE_CLAUDE_CODE: "true"
          OPENCODE_DISABLE_AUTOCOMPACT: "true"
          USER_PROMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.issue.body }}
        run: |
          RULES="$(cat TUTOR_RULES.md)"
          FULL_PROMPT="$RULES

Pergunta do aluno:
$USER_PROMPT

Responda somente como Tutor BIOMED. Não use ferramentas nem altere arquivos."
          timeout 180s opencode --pure run             --model opencode/muse-spark-1.3-contributor-free             --agent build             --format json             "$FULL_PROMPT" | tee opencode-output.ndjson

      - name: Validar resposta
        shell: bash
        run: |
          test -s opencode-output.ndjson
          grep -q '"type"' opencode-output.ndjson
          echo "OpenCode Tutor executado com Muse Spark 1.3 Contributor Free."
