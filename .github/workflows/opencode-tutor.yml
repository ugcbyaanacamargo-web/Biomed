name: BIOMED OpenCode Tutor - read only

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Pergunta pedagógica para testar o tutor"
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  id-token: write
  contents: read
  actions: read
  issues: read

jobs:
  tutor:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[BIOMED TUTOR]')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
      issues: read

    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Obter credencial OIDC efêmera do GitHub
        shell: bash
        run: |
          RESPONSE="$(curl -fsS             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=biomed-opencode")"
          TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.value')"
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "::add-mask::$TOKEN"
          echo "BIOMED_PROXY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Executar OpenCode Tutor gratuito
        uses: anomalyco/opencode/github@latest
        env:
          BIOMED_PROXY_TOKEN: ${{ env.BIOMED_PROXY_TOKEN }}
        with:
          model: biomed-free/biomed-tutor
          agent: tutor
          share: false
          prompt: |
            Você é o Tutor BIOMED.
            Siga integralmente TUTOR_RULES.md.
            Esta execução é SOMENTE LEITURA.
            Não altere arquivos, branches, issues, pull requests ou configurações.
            Não execute tarefas administrativas.
            Responda apenas como tutor educacional.

            Pergunta:
            ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.issue.body }}
