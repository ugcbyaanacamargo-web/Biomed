name: BIOMED CI
on:
  push:
    branches:
      - feat/ai-first-rebuild
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Persist dependency lock
        if: github.ref_name == 'feat/ai-first-rebuild' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock dependencies [skip ci]"
            git push origin HEAD:feat/ai-first-rebuild
          fi
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
