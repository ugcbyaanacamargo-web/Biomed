<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="t"><title id="t">Modelo visual da Teoria do Portão</title>
<rect width="980" height="560" rx="36" fill="#f7fbfe"/><g font-family="Arial">
<text x="48" y="58" font-size="30" font-weight="800" fill="#14395a">Teoria do Portão: duas entradas competem na medula</text>
<rect x="52" y="112" width="250" height="150" rx="24" fill="#ffe5e7"/><circle cx="100" cy="160" r="22" fill="#e8404f"/><text x="140" y="160" font-size="26" font-weight="800" fill="#9d2430">Aδ / C</text><text x="82" y="205" font-size="20" fill="#633840">entrada nociceptiva</text><text x="82" y="235" font-size="18" fill="#73505a">favorece transmissão</text>
<rect x="52" y="308" width="250" height="150" rx="24" fill="#e2f2ff"/><circle cx="100" cy="355" r="22" fill="#1e86d9"/><text x="140" y="355" font-size="26" font-weight="800" fill="#175a8d">Aβ</text><text x="82" y="400" font-size="20" fill="#305b78">toque / pressão</text><text x="82" y="430" font-size="18" fill="#4d728a">pode recrutar inibição</text>
<path d="M302 186H430" stroke="#e8404f" stroke-width="10"/><path d="M302 382H430" stroke="#1e86d9" stroke-width="10"/>
<rect x="430" y="125" width="280" height="330" rx="34" fill="#fff" stroke="#cfe0ea" stroke-width="4"/><text x="470" y="170" font-size="24" font-weight="800" fill="#14395a">CORNO DORSAL</text>
<circle cx="518" cy="315" r="48" fill="#dff5e8" stroke="#2dad69" stroke-width="6"/><text x="478" y="307" font-size="17" font-weight="700" fill="#157344">interneurônio</text><text x="493" y="330" font-size="17" font-weight="700" fill="#157344">inibitório</text>
<circle cx="635" cy="256" r="52" fill="#fff0d7" stroke="#e0a22c" stroke-width="6"/><text x="590" y="250" font-size="17" font-weight="700" fill="#80550a">neurônio de</text><text x="598" y="274" font-size="17" font-weight="700" fill="#80550a">projeção</text>
<path d="M430 186c80 0 94 40 155 58" fill="none" stroke="#e8404f" stroke-width="8"/><path d="M430 382c52-5 69-27 83-50" fill="none" stroke="#1e86d9" stroke-width="8"/><path d="M560 296l33-22" stroke="#2dad69" stroke-width="8"/><path d="M579 250l-16-18M579 250l-18 14" stroke="#2dad69" stroke-width="6"/>
<path d="M687 256H860" stroke="#e0a22c" stroke-width="11"/><path d="m838 235 38 21-38 21" fill="#e0a22c"/><text x="757" y="210" font-size="20" font-weight="700" fill="#80550a">sinal ascendente</text>
<text x="736" y="330" font-size="20" font-weight="800" fill="#14395a">Aβ pode reduzir</text><text x="736" y="358" font-size="20" font-weight="800" fill="#14395a">a saída nociceptiva</text><text x="48" y="518" font-size="18" fill="#617489">É um modelo didático: a modulação real envolve circuitos espinais e controle descendente mais complexos.</text></g></svg>